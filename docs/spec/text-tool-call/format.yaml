# Text Tool Call Format Specification
# AI-Protocol — 文本工具调用标准格式
# Version: 1.0.0 | Status: draft

version: "1.0.0"
status: draft

# Canonical wire format for LLMs that cannot use native function calling.
standard_format:
  wrapper_tag: "tool_call"
  body_format: json
  required_fields:
    - name        # string — tool name
    - arguments   # object — tool parameters
  example: |
    <tool_call>
    {"name": "shell", "arguments": {"command": "ls -la"}}
    </tool_call>

# Field aliases accepted by lenient parser (L2)
field_aliases:
  arguments:
    - parameters
    - params
    - args
  name:
    attribute: "name"   # <tool_call name="shell">...</tool_call>

# Wrapper aliases stripped by lenient parser (L3)
wrapper_aliases:
  outer:
    - tool_calls
  ignored_attributes:
    - id
    - index

# Known dialect mappings (L4) — tag → standard tool name
known_dialects:
  - tag: shell
    map_to: shell
    extract:
      command: "command"   # <shell><command>...</command></shell>
  - tag: bash
    map_to: shell
    extract:
      command: "text"      # <bash>...</bash> — inner text as command
  - tag: function
    map_to: "$attribute"   # <function name="x"> — name from attribute
    status: deferred        # not implemented in ai-lib-core; do not advertise in provider manifests until ready
  - tag: dsml
    # Wire form is U+FF5C fullwidth delimiter family (`｜｜DSML｜｜`), NOT a literal <dsml> XML tag.
    # `known_dialects[].tag: dsml` means this delimiter family.
    map_to: "$invoke_name"
    shapes:
      - name: invoke_parameter
        description: |
          Canonical DeepSeek DSML (ttc-007):
          <｜｜DSML｜｜tool_calls>
          <｜｜DSML｜｜invoke name="shell">
          <｜｜DSML｜｜parameter name="command" string="true">...</｜｜DSML｜｜parameter>
          </｜｜DSML｜｜invoke>
          </｜｜DSML｜｜tool_calls>
      - name: tool_call_json
        description: |
          Hybrid DSML wrapper around standard L1 JSON body (ttc-010; live DeepSeek Web UI):
          <｜｜DSML｜｜tool_call>
          {"name": "shell", "arguments": {"command": "..."}}
          </｜｜DSML｜｜tool_call>
        body_format: json   # same required_fields / field_aliases as standard_format

# Tool result round-trip format (inserted into conversation as assistant/user text)
result_format:
  wrapper_tag: "tool_result"
  body_format: json
  required_fields:
    - tool_use_id
    - content
  example: |
    <tool_result>
    {"tool_use_id": "call_abc", "content": "file listing output..."}
    </tool_result>

# Error handling
error_handling:
  on_unrecognized_format: ignore   # leave as plain text, do not execute
  on_malformed_json: skip_call     # skip individual call, continue parsing others
  max_call_depth: 1                # no recursive tool_call inside tool_call body

# Hybrid path (native API + text markup in content)
hybrid_parse:
  function: parse_hybrid_tool_calls
  policy: native_first             # use native_tool_calls when non-empty; else lenient text parse
  compliance_cases:
    - ttc-008   # native empty → DSML invoke/parameter fallback
    - ttc-009   # native non-empty → ignore text dialect
    - ttc-010   # DSML tool_call + standard JSON body
