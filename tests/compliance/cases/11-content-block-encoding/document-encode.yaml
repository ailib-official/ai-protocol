tags: ["content-block-encoding", "document", "P0"]
input:
  type: "content_block_encode"
  api_style: "anthropic_messages"
  blocks:
    - block_type: "document"
      source_type: "ref"
      data: "upload://abc"
      mime_type: "application/pdf"
  expect_error: true
expected:
  valid: false
