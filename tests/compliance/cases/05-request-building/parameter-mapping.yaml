# Request Building - Parameter Mapping
# Tests standard parameter to provider-specific parameter mapping

---
suite: "request-building"
name: "Map standard params to OpenAI format"
id: "req-001"
description: "Verify standard temperature and max_tokens map to OpenAI parameter format"
tags: ["request-building", "parameter-mapping", "openai", "P0"]
setup:
  provider: "mock-openai"
  manifest_path: "fixtures/providers/mock-openai.yaml"
input:
  type: "parameter_mapping"
  standard_params:
    temperature: 0.7
    max_tokens: 1024
  provider: "mock-openai"
expected:
  provider_params:
    temperature: 0.7
    max_tokens: 1024

---
suite: "request-building"
name: "Map standard params to Anthropic format"
id: "req-002"
description: "Verify standard params map to Anthropic-specific format (max_tokens)"
tags: ["request-building", "parameter-mapping", "anthropic", "P0"]
setup:
  provider: "mock-anthropic"
  manifest_path: "fixtures/providers/mock-anthropic.yaml"
input:
  type: "parameter_mapping"
  standard_params:
    temperature: 0.5
    max_tokens: 4096
  provider: "mock-anthropic"
expected:
  provider_params:
    temperature: 0.5
    max_tokens: 4096

---
suite: "request-building"
name: "Map optional parameters with defaults"
id: "req-003"
description: "Verify optional parameters use provider defaults when not specified"
tags: ["request-building", "parameter-mapping", "P1"]
setup:
  provider: "mock-openai"
  manifest_path: "fixtures/providers/mock-openai.yaml"
input:
  type: "parameter_mapping"
  standard_params:
    max_tokens: 512
  provider: "mock-openai"
expected:
  provider_params:
    temperature: 1.0
    max_tokens: 512
