suite: "advanced-capabilities"
name: "MCP endpoint mapping resolves configured operation"
id: "adv-005"
description: "EndpointFor should honor mcp operation mapping from manifest"
tags: ["advanced", "endpoint_mapping", "P1"]
input:
  type: "advanced_endpoint_mapping"
  operation: "mcp_call_tool"
  fallback: "/mcp/tools/call"
  manifest: |
    id: "endpoint-provider-mcp"
    protocol_version: "2.0"
    core:
      endpoint:
        base_url: "https://example.com"
        endpoints:
          mcp_call_tool:
            path: "/custom/mcp/call"
            method: "POST"
expected:
  path: "/custom/mcp/call"
  method: "POST"
---
