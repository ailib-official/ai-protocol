suite: "advanced-capabilities"
name: "Undeclared capability is blocked by guard"
id: "adv-001"
description: "Runtime must reject advanced capability calls when manifest capability is absent"
tags: ["advanced", "capability_guard", "P1"]
input:
  type: "capability_guard"
  method: "MCPListTools"
  manifest: |
    id: "guard-provider"
    protocol_version: "2.0"
    core:
      endpoint:
        base_url: "http://127.0.0.1:65535"
expected:
  error_code: "E1005"
---
