suite: "advanced-capabilities"
name: "MCP fallback is allowed for overloaded errors"
id: "adv-009"
description: "Fallback strategy should continue on fallbackable E3002 errors"
tags: ["advanced", "fallback", "P1"]
input:
  type: "fallback_decision"
  operation: "mcp"
  error_code: "E3002"
expected:
  should_fallback: true
---
suite: "advanced-capabilities"
name: "Computer use fallback is blocked for invalid request"
id: "adv-010"
description: "Fallback strategy should stop on non-fallbackable E1001 errors"
tags: ["advanced", "fallback", "P1"]
input:
  type: "fallback_decision"
  operation: "computer_use"
  error_code: "E1001"
expected:
  should_fallback: false
