suite: "advanced-capabilities"
name: "MCP provider-mock behavior body assertions"
id: "adv-013"
description: "Assert mcp request/response body contract fields"
tags: ["advanced", "provider_mock_behavior", "P1"]
input:
  type: "provider_mock_behavior"
  operation: "mcp"
  request_body:
    name: "search"
    arguments:
      query: "ai-lib"
  response_body:
    content:
      - type: "text"
        text: "ok"
    is_error: false
expected:
  request_assert:
    name: "search"
    arguments.query: "ai-lib"
  response_assert:
    content.0.type: "text"
    is_error: false
---
suite: "advanced-capabilities"
name: "Computer use provider-mock behavior body assertions"
id: "adv-014"
description: "Assert computer_use request/response body contract fields"
tags: ["advanced", "provider_mock_behavior", "P1"]
input:
  type: "provider_mock_behavior"
  operation: "computer_use"
  request_body:
    session_id: "s1"
    actions:
      - action_type: "click"
        parameters:
          x: 10
          y: 20
  response_body:
    session_id: "s1"
    results:
      - ok: true
expected:
  request_assert:
    session_id: "s1"
    actions.0.action_type: "click"
  response_assert:
    session_id: "s1"
    results.0.ok: true
---
suite: "advanced-capabilities"
name: "Reasoning provider-mock behavior body assertions"
id: "adv-015"
description: "Assert reasoning request/response body contract fields"
tags: ["advanced", "provider_mock_behavior", "P1"]
input:
  type: "provider_mock_behavior"
  operation: "reasoning"
  request_body:
    model: "reasoner"
    prompt: "why"
    max_tokens: 256
  response_body:
    model: "reasoner"
    reasoning: "step-by-step"
    final_answer: "because"
expected:
  request_assert:
    model: "reasoner"
    prompt: "why"
  response_assert:
    model: "reasoner"
    final_answer: "because"
---
