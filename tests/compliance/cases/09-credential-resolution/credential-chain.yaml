# Credential Resolution - Unified BYOK Chain (PT-074)
# These cases define cross-runtime semantics. Runners should not make network calls.

---
suite: "credential-resolution"
name: "Explicit credential override wins over environment"
id: "cred-001"
description: "Application-supplied credentials take precedence over manifest and conventional environment variables."
tags: ["credential", "byok", "explicit", "P0"]
setup:
  provider: "replicate"
  manifest_path: "fixtures/providers/mock-credential-v1.yaml"
  env:
    REPLICATE_API_TOKEN: "env-token-value"
    REPLICATE_API_KEY: "conventional-key-value"
input:
  type: "credential_resolution"
  provider: "replicate"
  explicit_credential: "explicit-token-value"
expected:
  status: "available"
  source_kind: "explicit"
  source_name: "explicit"
  required: ["REPLICATE_API_TOKEN"]
  value_redacted: true
  must_not_contain:
    - "explicit-token-value"
    - "env-token-value"
    - "conventional-key-value"

---
suite: "credential-resolution"
name: "Manifest token_env is used before conventional provider API key"
id: "cred-002"
description: "The manifest-declared token_env is canonical when both manifest and conventional env vars exist."
tags: ["credential", "byok", "manifest-env", "P0"]
setup:
  provider: "replicate"
  manifest_path: "fixtures/providers/mock-credential-v1.yaml"
  env:
    REPLICATE_API_TOKEN: "manifest-token-value"
    REPLICATE_API_KEY: "conventional-key-value"
input:
  type: "credential_resolution"
  provider: "replicate"
expected:
  status: "available"
  source_kind: "manifest_env"
  source_name: "REPLICATE_API_TOKEN"
  required: ["REPLICATE_API_TOKEN"]
  value_redacted: true
  must_not_contain:
    - "manifest-token-value"
    - "conventional-key-value"

---
suite: "credential-resolution"
name: "Conventional provider API key is compatibility fallback"
id: "cred-003"
description: "If manifest-declared env vars are missing, runtimes may use the compatibility {PROVIDER_ID}_API_KEY fallback."
tags: ["credential", "byok", "conventional-env", "P0"]
setup:
  provider: "replicate"
  manifest_path: "fixtures/providers/mock-credential-v1.yaml"
  env:
    REPLICATE_API_KEY: "conventional-key-value"
input:
  type: "credential_resolution"
  provider: "replicate"
expected:
  status: "available"
  source_kind: "conventional_env"
  source_name: "REPLICATE_API_KEY"
  required: ["REPLICATE_API_TOKEN"]
  value_redacted: true
  must_not_contain:
    - "conventional-key-value"

---
suite: "credential-resolution"
name: "Missing credential returns redacted actionable diagnostics"
id: "cred-004"
description: "Missing credentials are reported without exposing secret values or attempting a network call."
tags: ["credential", "byok", "missing", "diagnostics", "P0"]
setup:
  provider: "replicate"
  manifest_path: "fixtures/providers/mock-credential-v1.yaml"
  env: {}
input:
  type: "credential_resolution"
  provider: "replicate"
expected:
  status: "missing"
  source_kind: "none"
  source_name: null
  required: ["REPLICATE_API_TOKEN"]
  conventional_fallbacks: ["REPLICATE_API_KEY"]
  diagnostic_contains:
    - "REPLICATE_API_TOKEN"
  diagnostic_must_not_contain:
    - "sk-"
    - "token-value"
    - "api-key-value"

---
suite: "credential-resolution"
name: "V2 endpoint auth token_env is canonical"
id: "cred-005"
description: "V2 endpoint.auth.token_env participates in the same chain as top-level V1 auth."
tags: ["credential", "byok", "v2", "endpoint-auth", "P0"]
setup:
  provider: "headerauth"
  manifest_path: "fixtures/providers/mock-credential-v2-endpoint.yaml"
  env:
    HEADERAUTH_TOKEN: "headerauth-token-value"
input:
  type: "credential_resolution"
  provider: "headerauth"
expected:
  status: "available"
  source_kind: "manifest_env"
  source_name: "HEADERAUTH_TOKEN"
  required: ["HEADERAUTH_TOKEN"]
  value_redacted: true
  must_not_contain:
    - "headerauth-token-value"

---
suite: "credential-resolution"
name: "Custom header auth attachment uses manifest header name"
id: "cred-006"
description: "Resolved credentials are attached according to V2 endpoint.auth custom_header metadata."
tags: ["credential", "auth-attachment", "custom-header", "P0"]
setup:
  provider: "headerauth"
  manifest_path: "fixtures/providers/mock-credential-v2-endpoint.yaml"
  env:
    HEADERAUTH_TOKEN: "headerauth-token-value"
input:
  type: "auth_attachment"
  provider: "headerauth"
expected:
  headers:
    X-Provider-Token: "<redacted>"
  query_params: {}
  source_kind: "manifest_env"
  source_name: "HEADERAUTH_TOKEN"
  must_not_contain:
    - "headerauth-token-value"

---
suite: "credential-resolution"
name: "Query-param auth attachment uses manifest parameter name"
id: "cred-007"
description: "Resolved credentials are attached as a redacted query parameter for query_param auth."
tags: ["credential", "auth-attachment", "query-param", "P0"]
setup:
  provider: "queryauth"
  manifest_path: "fixtures/providers/mock-credential-query-param.yaml"
  env:
    QUERYAUTH_API_KEY: "queryauth-key-value"
input:
  type: "auth_attachment"
  provider: "queryauth"
expected:
  headers: {}
  query_params:
    api_key: "<redacted>"
  source_kind: "manifest_env"
  source_name: "QUERYAUTH_API_KEY"
  must_not_contain:
    - "queryauth-key-value"

---
suite: "credential-resolution"
name: "Endpoint auth is single source when top-level auth diverges"
id: "cred-009"
description: |
  When a manifest declares both endpoint.auth and a divergent top-level auth
  block, runtimes MUST treat endpoint.auth as the single source of truth for
  credential resolution: only its (type, token_env|key_env) participates in
  the chain, and request attachment uses its (type, header, prefix) shape.
  The shadowed top-level block contributes no env names. Runtimes SHOULD
  emit one diagnostic identifying the shadowed block so operators can clean
  the manifest up.
tags: ["credential", "byok", "v1-v2-compat", "single-source", "P0"]
setup:
  provider: "dualauth"
  manifest_path: "fixtures/providers/mock-credential-dual-auth.yaml"
  env:
    DUALAUTH_API_TOKEN: "endpoint-token-value"
    DUALAUTH_LEGACY_KEY: "legacy-key-value"
input:
  type: "credential_resolution"
  provider: "dualauth"
expected:
  status: "available"
  source_kind: "manifest_env"
  source_name: "DUALAUTH_API_TOKEN"
  required: ["DUALAUTH_API_TOKEN"]
  shadowed_envs_must_not_resolve: ["DUALAUTH_LEGACY_KEY"]
  diagnostic_should_mention:
    - "DUALAUTH_LEGACY_KEY"
  value_redacted: true
  must_not_contain:
    - "endpoint-token-value"
    - "legacy-key-value"

---
suite: "credential-resolution"
name: "Endpoint auth shape wins when only legacy env is set"
id: "cred-010"
description: |
  Companion to cred-009. With endpoint.auth and top-level auth declared
  divergently and ONLY the legacy env populated, runtimes MUST report the
  credential as missing (the legacy env name is no longer a candidate) and
  surface the canonical endpoint.auth env in diagnostics. This guarantees
  V1→V2 manifest drift cannot silently keep working with legacy envs.
tags: ["credential", "byok", "v1-v2-compat", "single-source", "missing", "P0"]
setup:
  provider: "dualauth"
  manifest_path: "fixtures/providers/mock-credential-dual-auth.yaml"
  env:
    DUALAUTH_LEGACY_KEY: "legacy-key-value"
input:
  type: "credential_resolution"
  provider: "dualauth"
expected:
  status: "missing"
  source_kind: "none"
  source_name: null
  required: ["DUALAUTH_API_TOKEN"]
  conventional_fallbacks: ["DUALAUTH_API_KEY"]
  diagnostic_contains:
    - "DUALAUTH_API_TOKEN"
  diagnostic_must_not_contain:
    - "legacy-key-value"

---
suite: "credential-resolution"
name: "WASM uses host-supplied explicit credential only"
id: "cred-008"
description: "Minimal WASM runners must not implicitly read host environment or keyring state."
tags: ["credential", "wasm", "host-supplied", "P0"]
setup:
  provider: "replicate"
  manifest_path: "fixtures/providers/mock-credential-v1.yaml"
  env:
    REPLICATE_API_TOKEN: "host-env-token-ignored-by-wasm"
input:
  type: "credential_resolution"
  provider: "replicate"
  runtime_target: "wasm32-wasip1"
  explicit_credential: "host-supplied-token"
expected:
  status: "available"
  source_kind: "explicit"
  source_name: "host_supplied"
  required: ["REPLICATE_API_TOKEN"]
  implicit_env_allowed: false
  implicit_keyring_allowed: false
  value_redacted: true
  must_not_contain:
    - "host-env-token-ignored-by-wasm"
    - "host-supplied-token"
