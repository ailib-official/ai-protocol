# Error Classification - Retryable and Fallbackable Classification
# Tests retryable/fallbackable flags for various error types

---
suite: "error-classification"
name: "rate_limited is retryable and fallbackable"
id: "err-014"
description: "Verify rate_limited (E2001) is classified as retryable and fallbackable"
tags: ["error", "retryable", "fallbackable", "P0"]
setup:
  provider: "mock-openai"
  manifest_path: "fixtures/providers/mock-openai.yaml"
input:
  type: "error_classification"
  http_status: 429
  response_body:
    error:
      message: "Rate limit exceeded"
      type: "rate_limit_exceeded"
      code: "rate_limit_exceeded"
expected:
  error_code: "E2001"
  error_name: "rate_limited"
  retryable: true
  fallbackable: true

