# Error Classification - Provider-Specific Error Code Mapping
# Tests provider error codes for OpenAI and Anthropic

---
suite: "error-classification"
name: "OpenAI invalid_api_key maps to authentication"
id: "err-008"
description: "Verify OpenAI error code invalid_api_key maps to authentication (E1002)"
tags: ["error", "classification", "provider-codes", "openai", "P0"]
setup:
  provider: "mock-openai"
  manifest_path: "fixtures/providers/mock-openai.yaml"
input:
  type: "error_classification"
  http_status: 401
  response_body:
    error:
      message: "Invalid API key"
      type: "invalid_request_error"
      code: "invalid_api_key"
expected:
  error_code: "E1002"
  error_name: "authentication"
  retryable: false
  fallbackable: true

