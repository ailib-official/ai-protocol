# Error Classification - HTTP Status to Error Code Mapping
# Tests HTTP status code mapping for OpenAI provider

---
suite: "error-classification"
name: "HTTP 400 maps to invalid_request"
id: "err-001"
description: "Verify that HTTP 400 is classified as invalid_request (E1001)"
tags: ["error", "classification", "http-status", "openai", "P0"]
setup:
  provider: "mock-openai"
  manifest_path: "fixtures/providers/mock-openai.yaml"
input:
  type: "error_classification"
  http_status: 400
  response_body:
    error:
      message: "Invalid request"
      type: "invalid_request_error"
      code: "invalid_request_error"
expected:
  error_code: "E1001"
  error_name: "invalid_request"
  retryable: false
  fallbackable: false

