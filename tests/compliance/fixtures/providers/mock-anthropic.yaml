# Mock Anthropic provider manifest for compliance testing
$schema: "https://raw.githubusercontent.com/hiddenpath/ai-protocol/main/schemas/v1.json"

id: anthropic
protocol_version: "1.5"
name: "Anthropic (Mock)"
status: "stable"

endpoint:
  base_url: "https://api.anthropic.com"
  chat: "/v1/messages"
  auth:
    type: "custom_header"
    header: "x-api-key"

api_families:
  chat:
    request_format: "anthropic"
    response_format: "anthropic"

capabilities: [chat, streaming, tools, vision, agentic, reasoning]

parameters:
  temperature: { type: float, range: [0.0, 1.0], default: 1.0 }
  max_tokens: { type: integer, min: 1, max: 8192 }
  top_p: { type: float, range: [0.0, 1.0] }
  top_k: { type: integer, min: 0 }
  stream: { type: boolean }

streaming:
  decoder:
    format: "anthropic_sse"
    strategy: "anthropic_event_stream"
  event_map:
    - match: "$.type == 'content_block_delta' && $.delta.type == 'text_delta'"
      emit: "PartialContentDelta"
      extract:
        content: "$.delta.text"
    - match: "$.type == 'content_block_delta' && $.delta.type == 'input_json_delta'"
      emit: "PartialToolCall"
      extract:
        partial_json: "$.delta.partial_json"
    - match: "$.type == 'content_block_delta' && $.delta.type == 'thinking_delta'"
      emit: "ThinkingDelta"
      extract:
        thinking: "$.delta.thinking"
    - match: "$.type == 'message_delta'"
      emit: "StreamEnd"
      extract:
        finish_reason: "$.delta.stop_reason"
  accumulator:
    stateful_tool_parsing: true
    key_path: "$.delta.partial_json"
    flush_on: "$.type == 'content_block_stop'"

error_classification:
  by_http_status:
    "400": "invalid_request"
    "401": "authentication"
    "403": "permission_denied"
    "404": "not_found"
    "413": "request_too_large"
    "429": "rate_limited"
    "500": "server_error"
    "529": "overloaded"

retry_policy:
  strategy: "exponential_backoff"
  max_retries: 3
  min_delay_ms: 1000
  max_delay_ms: 60000
  jitter: "full"
  retry_on_http_status: [429, 500, 529]
