$schema: "https://raw.githubusercontent.com/ailib-official/ai-protocol/main/schemas/v2/provider.json"
id: google_ios
protocol_version: "2.0"
endpoint:
  base_url: "https://generativelanguage.googleapis.com/v1beta"
  chat: "/models/{model}:generateContent"
  auth:
    type: bearer
    token_env: "GEMINI_API_KEY"
error_classification:
  by_http_status:
    "429": "rate_limited"
capabilities:
  required: ["text", "streaming", "tools"]
  optional: ["vision", "audio", "video"]
capability_profile:
  phase: "ios_v1"
  inputs:
    modalities: ["text", "image"]
    max_references: 12
    max_payload_mb: 128
  outcomes:
    types: ["structured_json", "tool_call_sequence"]
    quality_tier: "standard"
  systems:
    requires: ["mcp", "search"]
