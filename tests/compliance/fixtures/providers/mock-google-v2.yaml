$schema: "https://raw.githubusercontent.com/hiddenpath/ai-protocol/main/schemas/v2/provider.json"
id: google
protocol_version: "2.0"
endpoint:
  base_url: "https://generativelanguage.googleapis.com/v1beta"
  chat: "/models/{model}:generateContent"
  auth:
    type: bearer
    token_env: "GEMINI_API_KEY"
error_classification:
  by_http_status:
    "429": "rate_limited"
capabilities:
  required: ["text", "streaming", "tools"]
  optional: ["vision", "audio", "video", "image_generation", "stt", "tts"]
multimodal:
  input:
    vision:
      supported: true
      formats: [jpeg, png, webp]
      encoding_methods: [url, inline_base64]
    audio:
      supported: true
      formats: [wav, mp3]
    video:
      supported: true
      formats: [mp4]
  output:
    text: true
    audio:
      supported: true
      formats: [wav]
    image:
      supported: true
      formats: [png]
    video:
      supported: false
