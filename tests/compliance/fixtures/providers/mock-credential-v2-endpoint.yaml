# Mock V2 provider for endpoint.auth credential-chain compliance.
$schema: "https://raw.githubusercontent.com/ailib-official/ai-protocol/main/schemas/v2/provider.json"

id: headerauth
protocol_version: "2.0"
name: "Header Auth Credential Mock"
version: "1.0.0"
status: stable
category: ai_provider
official_url: "https://example.com/headerauth"
support_contact: "https://example.com/support"

endpoint:
  base_url: "https://api.headerauth.example/v1"
  chat: "/chat/completions"
  auth:
    type: "custom_header"
    header: "X-Provider-Token"
    token_env: "HEADERAUTH_TOKEN"

capabilities:
  required: [text]
  optional: [streaming]

error_classification:
  by_http_status:
    "401": "authentication"
    "429": "rate_limited"
    "500": "server_error"
