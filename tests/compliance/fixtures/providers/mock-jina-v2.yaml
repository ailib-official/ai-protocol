$schema: "https://raw.githubusercontent.com/hiddenpath/ai-protocol/main/schemas/v2/provider.json"
id: jina
protocol_version: "2.0"
endpoint:
  base_url: "https://api.jina.ai"
  rerank: "/v1/rerank"
  auth:
    type: bearer
    token_env: "JINA_API_KEY"
error_classification:
  by_http_status:
    "429": "rate_limited"
capabilities:
  required: ["rerank"]
  optional: []
parameters:
  top_n: { type: integer, min: 1 }

