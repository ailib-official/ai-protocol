# Mock V1.5 provider declaring BOTH endpoint.auth and top-level auth with
# divergent (type, env). Used by the cred-009 compliance case to lock down
# the "primary_auth single source" rule: endpoint.auth wins, top-level auth
# is treated as legacy fallback only and must not contribute env names to
# credential resolution or attachment.
$schema: "https://raw.githubusercontent.com/ailib-official/ai-protocol/main/schemas/v1.5/provider.json"

id: dualauth
protocol_version: "1.5"
name: "Dual Auth Credential Mock"
version: "1.0.0"
status: stable
category: ai_provider
official_url: "https://example.com/dualauth"
support_contact: "https://example.com/support"

endpoint:
  base_url: "https://api.dualauth.example/v1"
  chat: "/chat/completions"
  auth:
    type: "bearer"
    token_env: "DUALAUTH_API_TOKEN"

# Legacy V1 block intentionally divergent from endpoint.auth above. Runtimes
# must ignore this block once endpoint.auth is present, and SHOULD surface a
# diagnostic so operators can clean the manifest up.
auth:
  type: "api_key"
  key_env: "DUALAUTH_LEGACY_KEY"
  header: "X-Legacy-Key"

capabilities:
  required: [text]
  optional: [streaming]

error_classification:
  by_http_status:
    "401": "authentication"
    "429": "rate_limited"
    "500": "server_error"
