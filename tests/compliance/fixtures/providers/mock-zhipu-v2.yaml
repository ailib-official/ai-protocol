$schema: "https://raw.githubusercontent.com/ailib-official/ai-protocol/main/schemas/v2/provider.json"
id: zhipu
protocol_version: "2.0"
endpoint:
  base_url: "https://open.bigmodel.cn/api/paas/v4"
  chat: "/chat/completions"
  auth:
    type: bearer
    token_env: "ZHIPU_API_KEY"
error_classification:
  by_http_status:
    "429": "rate_limited"
capabilities:
  required: ["text", "streaming", "tools"]
  optional: ["reasoning", "structured_output"]
multimodal:
  input:
    vision:
      supported: false
    audio:
      supported: false
    video:
      supported: false
  output:
    text: true
    video:
      supported: false

