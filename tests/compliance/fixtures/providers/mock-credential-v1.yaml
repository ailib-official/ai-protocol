# Mock V1 provider for credential-chain compliance.
$schema: "https://raw.githubusercontent.com/ailib-official/ai-protocol/main/schemas/v1.json"

id: replicate
protocol_version: "1.5"
name: "Replicate (Credential Mock)"
status: "stable"

endpoint:
  base_url: "https://api.replicate.example/v1"
  chat: "/chat/completions"

auth:
  type: "bearer"
  token_env: "REPLICATE_API_TOKEN"

api_families:
  chat:
    request_format: "openai"
    response_format: "openai"

capabilities: [chat]

parameters:
  temperature: { type: float, range: [0.0, 2.0], default: 1.0 }
  max_tokens: { type: integer, min: 1, max: 128000 }

error_classification:
  by_http_status:
    "401": "authentication"
    "429": "rate_limited"
    "500": "server_error"
