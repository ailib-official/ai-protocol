# AI-Protocol v1.5 Example: Simple Streaming Chat
# Minimal OpenAI-style streaming configuration (schema-valid subset)

$schema: "https://raw.githubusercontent.com/ailib-official/ai-protocol/main/schemas/v1.json"

id: openai_simple_stream
protocol_version: "1.5"
name: "OpenAI Simple Streaming (Example)"
status: stable

endpoint:
  base_url: "https://api.openai.com/v1"
  protocol: https
  timeout_ms: 30000

auth:
  type: bearer
  token_env: "OPENAI_API_KEY"

availability:
  required: false
  regions:
    - global
  check:
    method: GET
    path: "/models"
    expected_status: [200, 401]
    timeout_ms: 3000

parameter_mappings:
  temperature: "temperature"
  max_tokens: "max_tokens"
  stream: "stream"
  top_p: "top_p"
  model: "model"

streaming:
  decoder:
    format: openai_sse
    strategy: openai_chat
    done_signal: "[DONE]"
    prefix: "data: "
  event_map:
    - match: "$.choices[0].delta.content"
      emit: PartialContentDelta
      extract:
        content: "$.choices[0].delta.content"
    - match: "$.choices[0].finish_reason"
      emit: StreamEnd
      extract:
        finish_reason: "$.choices[0].finish_reason"

capabilities:
  chat: true
  streaming: true
  tools: false
  vision: false
  agentic: false
  reasoning: false

error_classification:
  by_http_status:
    "400": invalid_request
    "401": authentication
    "429": rate_limited
    "500": server_error

retry_policy:
  strategy: exponential_backoff
  min_delay_ms: 1000
  max_delay_ms: 30000
  jitter: full
  max_retries: 3
  retry_on_http_status: [429, 500]

notes:
  - "Minimal streaming example; see v1/providers/openai.yaml for the full manifest."
