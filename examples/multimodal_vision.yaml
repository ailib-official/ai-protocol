# AI-Protocol v1.5 Example: Multimodal Vision
# Gemini-style vision-capable provider (schema-valid subset)

$schema: "https://raw.githubusercontent.com/ailib-official/ai-protocol/main/schemas/v1.json"

id: gemini_vision
protocol_version: "1.5"
name: "Google Gemini Vision (Example)"
status: stable

endpoint:
  base_url: "https://generativelanguage.googleapis.com/v1beta"
  protocol: https
  timeout_ms: 60000

auth:
  type: api_key
  key_env: "GOOGLE_API_KEY"
  header_name: "x-goog-api-key"

availability:
  required: false
  regions:
    - global
  check:
    method: GET
    path: "/models"
    expected_status: [200, 401]
    timeout_ms: 5000

parameter_mappings:
  temperature: "generationConfig.temperature"
  max_tokens: "generationConfig.maxOutputTokens"
  top_p: "generationConfig.topP"
  stream: "stream"
  contents: "contents"

streaming:
  decoder:
    format: gemini_json
    strategy: gemini_stream
    delimiter: "\r\n"
    prefix: "data: "
  event_map:
    - match: "$.candidates[0].content.parts[0].text"
      emit: PartialContentDelta
      extract:
        content: "$.candidates[0].content.parts[0].text"
    - match: "$.candidates[0].finishReason"
      emit: StreamEnd
      extract:
        finish_reason: "$.candidates[0].finishReason"

capabilities:
  chat: true
  streaming: true
  tools: false
  vision: true
  multimodal: true
  agentic: false
  reasoning: false

error_classification:
  by_http_status:
    "400": invalid_request
    "429": rate_limited
    "500": server_error
  by_message_contains:
    "image": invalid_request
    "vision": invalid_request

retry_policy:
  strategy: exponential_backoff
  min_delay_ms: 1000
  max_delay_ms: 30000
  jitter: full
  max_retries: 3
  retry_on_http_status: [429, 500]

notes:
  - "Vision example with multimodal content blocks; image size/format limits are provider-specific."
  - "For production manifests see v1/providers/gemini.yaml."
