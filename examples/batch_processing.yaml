# AI-Protocol v1.5 Example: Batch-Oriented Chat
# Non-streaming Anthropic-style manifest tuned for throughput (schema-valid subset)

$schema: "https://raw.githubusercontent.com/ailib-official/ai-protocol/main/schemas/v1.json"

id: anthropic_batch
protocol_version: "1.5"
name: "Anthropic Batch Chat (Example)"
status: stable

endpoint:
  base_url: "https://api.anthropic.com/v1"
  protocol: https
  timeout_ms: 120000

auth:
  type: bearer
  token_env: "ANTHROPIC_API_KEY"
  extra_headers:
    - name: anthropic-version
      value: "2023-06-01"

availability:
  required: false
  regions:
    - global
  check:
    method: GET
    path: "/models"
    expected_status: [200, 401]
    timeout_ms: 5000

parameter_mappings:
  temperature: "temperature"
  max_tokens: "max_tokens"
  stream: "stream"
  model: "model"
  messages: "messages"

capabilities:
  chat: true
  streaming: false
  tools: false
  vision: false
  agentic: false
  reasoning: false

error_classification:
  by_http_status:
    "400": invalid_request
    "401": authentication
    "429": rate_limited
    "500": server_error

retry_policy:
  strategy: exponential_backoff
  min_delay_ms: 2000
  max_delay_ms: 60000
  jitter: full
  max_retries: 2
  retry_on_http_status: [429, 500]

notes:
  - "Batch workloads typically disable streaming and use higher timeouts."
  - "Runtimes may parallelize independent requests; respect provider rate limits."
  - "For production manifests see v1/providers/anthropic.yaml."
