# AI-Protocol v1.5 Example: Function Calling
# OpenAI-style tool streaming configuration (schema-valid subset)

$schema: "https://raw.githubusercontent.com/ailib-official/ai-protocol/main/schemas/v1.json"

id: openai_function_calling
protocol_version: "1.5"
name: "OpenAI Function Calling (Example)"
status: stable

endpoint:
  base_url: "https://api.openai.com/v1"
  protocol: https
  timeout_ms: 30000

auth:
  type: bearer
  token_env: "OPENAI_API_KEY"

availability:
  required: false
  regions:
    - global
  check:
    method: GET
    path: "/models"
    expected_status: [200, 401]
    timeout_ms: 3000

parameter_mappings:
  temperature: "temperature"
  max_tokens: "max_tokens"
  stream: "stream"
  top_p: "top_p"
  model: "model"
  tools: "tools"
  tool_choice: "tool_choice"

streaming:
  decoder:
    format: openai_sse
    strategy: openai_chat
    done_signal: "[DONE]"
    prefix: "data: "
  accumulator:
    stateful_tool_parsing: true
    key_path: "$.choices[0].delta.tool_calls[0].function.arguments"
    flush_on: "$.choices[0].finish_reason == 'tool_calls'"
  event_map:
    - match: "$.choices[0].delta.content"
      emit: PartialContentDelta
      extract:
        content: "$.choices[0].delta.content"
    - match: "$.choices[0].delta.tool_calls"
      emit: PartialToolCall
      extract:
        tool_calls: "$.choices[0].delta.tool_calls"
    - match: "$.choices[0].finish_reason"
      emit: StreamEnd
      extract:
        finish_reason: "$.choices[0].finish_reason"

tooling:
  source_model: openai_tool_calls
  tool_use:
    index_path: "$.choices[0].delta.tool_calls[0].index"
    arguments_path: "$.choices[0].delta.tool_calls[0].function.arguments"
    name_path: "$.choices[0].delta.tool_calls[0].function.name"

capabilities:
  chat: true
  streaming: true
  tools: true
  vision: false
  agentic: true
  reasoning: false
  parallel_tools: true

error_classification:
  by_http_status:
    "400": invalid_request
    "401": authentication
    "429": rate_limited
    "500": server_error
  by_message_contains:
    "tool": invalid_request
    "function": invalid_request

retry_policy:
  strategy: exponential_backoff
  min_delay_ms: 1000
  max_delay_ms: 30000
  jitter: full
  max_retries: 3
  retry_on_http_status: [429, 500]

notes:
  - "Streaming tool calls require argument accumulation via streaming.accumulator."
  - "For full OpenAI manifest see v1/providers/openai.yaml."
