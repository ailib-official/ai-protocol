# 百度文心 / 千帆 (Baidu ERNIE via Qianfan) — AI-Protocol V2 (PT-ADM-008 Wave C / P2)
# Admits Qianfan OpenAI-compatible /v2/chat/completions (not legacy workshop wire).
# Legacy wenxinworkshop paths remain in v1 only.
$schema: "https://raw.githubusercontent.com/ailib-official/ai-protocol/main/schemas/v2/provider.json"

id: baidu
protocol_version: "2.0"
name: "百度文心 (Baidu ERNIE / Qianfan)"
version: "1.0.0"
status: stable
category: ai_provider
official_url: "https://cloud.baidu.com/doc/qianfan-api/s/omk3qc205"
support_contact: "https://cloud.baidu.com/support"
aliases:
  - ernie
  - qianfan

endpoint:
  base_url: "https://qianfan.baidubce.com/v2"
  chat: "/chat/completions"
  auth:
    type: "bearer"
    header: "Authorization"
    prefix: "Bearer"
    token_env: "BAIDU_API_KEY"

error_classification:
  by_http_status:
    "400": "invalid_request"
    "401": "authentication"
    "403": "permission_denied"
    "404": "not_found"
    "429": "rate_limited"
    "500": "server_error"
    "503": "overloaded"
  by_error_code:
    "context_length_exceeded": "request_too_large"
    "model_not_found": "not_found"
    "rate_limit_exceeded": "rate_limited"

availability:
  required: false
  regions:
    - cn
  check:
    method: GET
    path: "/models"
    expected_status: [200, 401, 403]
    timeout_ms: 3000

capabilities:
  required:
    - text
    - streaming
    - tools
  optional:
    - vision
    - agentic
    - structured_output
  feature_flags:
    streaming_usage: true
    system_messages: true
    structured_output: true
  tool_calling:
    native:
      supported: true
      reliability: "partial"
      parallel: false
      streaming: true
      notes: "Qianfan OpenAI-compat tool calling; model-dependent. Legacy workshop used functions dialect (v1 only)."
    text_fallback: null

parameters:
  temperature: { type: float, range: [0.0, 2.0], default: 0.8 }
  max_tokens: { type: integer, min: 1, max: 131072 }
  top_p: { type: float, range: [0.0, 1.0] }
  stream: { type: boolean }

streaming:
  decoder:
    format: "sse"
    strategy: "openai_chat"
    done_signal: "[DONE]"
    prefix: "data: "
  content_path: "$.choices[0].delta.content"
  tool_call_path: "$.choices[0].delta.tool_calls"
  usage_path: "$.usage"
  event_map:
    - match: "exists($.choices[*].delta.content)"
      emit: "PartialContentDelta"
      fields:
        content: "$.choices[*].delta.content"
    - match: "exists($.choices[*].delta.tool_calls)"
      emit: "PartialToolCall"
      fields:
        tool_calls: "$.choices[*].delta.tool_calls"
    - match: "exists($.usage)"
      emit: "Metadata"
      fields:
        usage: "$.usage"
    - match: "$.choices[*].finish_reason != null"
      emit: "StreamEnd"
      fields:
        finish_reason: "$.choices[*].finish_reason"
  stop_condition: "$.choices[0].finish_reason != null"

multimodal:
  input:
    vision:
      supported: true
      formats: [jpeg, png, gif, webp]
      encoding_methods: [base64_inline, url]
    audio:
      supported: false
    video:
      supported: false
  output:
    text: true
    audio:
      supported: false
    image:
      supported: false

api_families:
  - chat_completions
default_api_family: chat_completions

endpoints:
  chat:
    path: "/chat/completions"
    method: "POST"
    adapter: "openai"

services:
  list_models:
    path: "/models"
    method: "GET"
    response_binding: "data"

retry_policy:
  strategy: "exponential_backoff"
  max_retries: 3
  min_delay_ms: 1000
  max_delay_ms: 30000
  jitter: "full"
  retry_on_http_status: [429, 500, 502, 503]

termination:
  source_field: "finish_reason"
  mapping:
    stop: "end_turn"
    length: "max_tokens"
    tool_calls: "tool_use"
    content_filter: "refusal"

metadata:
  api_compatibility: openai
  models:
    ernie-4.0-8k:
      context_window: 8192
      max_output_tokens: 2048
      status: active
      family: ernie-4.0
      model_capabilities:
        tool_call: true
        structured_output: true
        reasoning: false
        attachment: false
      modalities:
        input: [text]
        output: [text]
      verification:
        status: verified
        source: official_documentation
        verified_at: "2026-07-25"
    ernie-4.0-turbo-8k:
      context_window: 8192
      max_output_tokens: 2048
      status: active
      family: ernie-4.0
      model_capabilities:
        tool_call: true
        structured_output: true
        reasoning: false
        attachment: false
      modalities:
        input: [text]
        output: [text]
      verification:
        status: verified
        source: official_documentation
        verified_at: "2026-07-25"
    ernie-3.5-8k:
      context_window: 8192
      max_output_tokens: 2048
      status: active
      family: ernie-3.5
      model_capabilities:
        tool_call: true
        structured_output: false
        reasoning: false
        attachment: false
      modalities:
        input: [text]
        output: [text]
      verification:
        status: verified
        source: official_documentation
        verified_at: "2026-07-25"
  sdk:
    note: "OpenAI-compatible Qianfan v2 — use openai SDK with base_url https://qianfan.baidubce.com/v2 and Bearer BAIDU_API_KEY (IAM API Key). Legacy workshop + BAIDU_ACCESS_TOKEN remain v1-only."
    python: openai
    typescript: openai
