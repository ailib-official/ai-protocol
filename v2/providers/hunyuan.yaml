# 腾讯混元 (Tencent Hunyuan) — AI-Protocol V2 (PT-ADM-007 Wave C / P2)
# OpenAI-compatible chat; models annotated Experimental (ME-001).
$schema: "https://raw.githubusercontent.com/ailib-official/ai-protocol/main/schemas/v2/provider.json"

id: hunyuan
protocol_version: "2.0"
name: "腾讯混元 (Tencent Hunyuan)"
version: "1.0.0"
status: stable
category: ai_provider
official_url: "https://cloud.tencent.com/document/product/1729"
support_contact: "https://cloud.tencent.com/online-service"

endpoint:
  base_url: "https://hunyuan.tencentcloudapi.com"
  chat: "/v1/chat/completions"
  auth:
    type: "bearer"
    header: "Authorization"
    prefix: "Bearer"
    token_env: "HUNYUAN_API_KEY"

error_classification:
  by_http_status:
    "400": "invalid_request"
    "401": "authentication"
    "403": "permission_denied"
    "404": "not_found"
    "429": "rate_limited"
    "500": "server_error"
    "503": "overloaded"
  by_error_code:
    "context_length_exceeded": "request_too_large"
    "model_not_found": "not_found"
    "rate_limit_exceeded": "rate_limited"

availability:
  required: false
  regions:
    - cn
  check:
    method: GET
    path: "/v1/models"
    expected_status: [200, 401]
    timeout_ms: 3000

capabilities:
  required:
    - text
    - streaming
    - tools
  optional:
    - vision
    - parallel_tools
    - agentic
    - reasoning
    - structured_output
  feature_flags:
    parallel_tool_calls: true
    streaming_usage: true
    system_messages: true
    structured_output: true
  tool_calling:
    native:
      supported: true
      reliability: "full"
      parallel: true
      streaming: true
      notes: "OpenAI-compatible tool_calls; arguments are JSON strings"
    text_fallback: null

parameters:
  temperature: { type: float, range: [0.0, 2.0], default: 1.0 }
  max_tokens: { type: integer, min: 1, max: 32768 }
  top_p: { type: float, range: [0.0, 1.0] }
  stream: { type: boolean }

streaming:
  decoder:
    format: "sse"
    strategy: "openai_chat"
    done_signal: "[DONE]"
    prefix: "data: "
  content_path: "$.choices[0].delta.content"
  tool_call_path: "$.choices[0].delta.tool_calls"
  usage_path: "$.usage"
  event_map:
    - match: "exists($.choices[*].delta.content)"
      emit: "PartialContentDelta"
      fields:
        content: "$.choices[*].delta.content"
    - match: "exists($.choices[*].delta.tool_calls)"
      emit: "PartialToolCall"
      fields:
        tool_calls: "$.choices[*].delta.tool_calls"
    - match: "exists($.usage)"
      emit: "Metadata"
      fields:
        usage: "$.usage"
    - match: "$.choices[*].finish_reason != null"
      emit: "StreamEnd"
      fields:
        finish_reason: "$.choices[*].finish_reason"
  stop_condition: "$.choices[0].finish_reason != null"

multimodal:
  input:
    vision:
      supported: true
      formats: [jpeg, png, gif, webp]
      encoding_methods: [base64_inline, url]
    audio:
      supported: false
    video:
      supported: false
  output:
    text: true
    audio:
      supported: false
    image:
      supported: false

api_families:
  - chat_completions
default_api_family: chat_completions

endpoints:
  chat:
    path: "/v1/chat/completions"
    method: "POST"
    adapter: "openai"

services:
  list_models:
    path: "/v1/models"
    method: "GET"
    response_binding: "data"

retry_policy:
  strategy: "exponential_backoff"
  max_retries: 3
  min_delay_ms: 1000
  max_delay_ms: 30000
  jitter: "full"
  retry_on_http_status: [429, 500, 502, 503]

termination:
  source_field: "finish_reason"
  mapping:
    stop: "end_turn"
    length: "max_tokens"
    tool_calls: "tool_use"
    sensitive: "refusal"
    content_filter: "refusal"

metadata:
  api_compatibility: openai
  models:
    hunyuan-pro:
      context_window: 32768
      max_output_tokens: 8192
      status: active
      family: hunyuan-pro
      model_capabilities:
        tool_call: true
        structured_output: true
        reasoning: true
        attachment: false
      modalities:
        input: [text]
        output: [text]
      verification:
        status: verified
        source: official_documentation
        verified_at: "2026-07-25"
    hunyuan-turbo:
      context_window: 32768
      max_output_tokens: 8192
      status: active
      family: hunyuan-turbo
      model_capabilities:
        tool_call: true
        structured_output: true
        reasoning: false
        attachment: false
      modalities:
        input: [text]
        output: [text]
      verification:
        status: verified
        source: official_documentation
        verified_at: "2026-07-25"
    hunyuan-vision:
      context_window: 8192
      max_output_tokens: 4096
      status: active
      family: hunyuan-vision
      model_capabilities:
        tool_call: false
        reasoning: false
        attachment: true
      modalities:
        input: [text, image]
        output: [text]
      verification:
        status: verified
        source: official_documentation
        verified_at: "2026-07-25"
    hunyuan-2.0-instruct:
      context_window: 131072
      max_output_tokens: 16384
      status: active
      family: hunyuan
      model_capabilities:
        tool_call: true
        reasoning: false
        attachment: false
      modalities:
        input: [text]
        output: [text]
      verification:
        status: unverified
        source: provider_catalog
        verified_at: "2026-07-25"
        notes: "PT-ME-006 curated from tencent-coding-plan dump slice; confirm wire id on hunyuan OpenAI-compat endpoint"
    hunyuan-2.0-thinking:
      context_window: 131072
      max_output_tokens: 16384
      status: active
      family: hunyuan
      model_capabilities:
        tool_call: true
        reasoning: true
        attachment: false
      modalities:
        input: [text]
        output: [text]
      verification:
        status: unverified
        source: provider_catalog
        verified_at: "2026-07-25"
        notes: "PT-ME-006 curated from tencent-coding-plan dump slice; confirm wire id on hunyuan OpenAI-compat endpoint"
    hunyuan-t1:
      context_window: 131072
      max_output_tokens: 16384
      status: active
      family: hunyuan
      model_capabilities:
        tool_call: true
        reasoning: true
        attachment: false
      modalities:
        input: [text]
        output: [text]
      verification:
        status: unverified
        source: provider_catalog
        verified_at: "2026-07-25"
        notes: "PT-ME-006 curated from tencent-coding-plan dump slice; confirm wire id on hunyuan OpenAI-compat endpoint"
  sdk:
    note: "OpenAI-compatible — use openai SDK with base_url https://hunyuan.tencentcloudapi.com (path /v1/chat/completions). Native TC3 cloud APIs are out of this admit scope."
    python: openai
    typescript: openai
