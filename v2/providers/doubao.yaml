# Doubao V2 provider manifest — P0 multimodal generative coverage
$schema: "https://raw.githubusercontent.com/hiddenpath/ai-protocol/main/schemas/v2/provider.json"

id: doubao
protocol_version: "2.0"
name: "Doubao (Volcengine Ark)"
version: "3.0.0"
status: stable
category: ai_provider
official_url: "https://www.volcengine.com/docs/82379"
support_contact: "https://www.volcengine.com/contact"

endpoint:
  base_url: "https://ark.cn-beijing.volces.com/api/v3"
  chat: "/chat/completions"
  auth:
    type: "bearer"
    header: "Authorization"
    prefix: "Bearer"
    token_env: "VOLCENGINE_API_KEY"

error_classification:
  by_http_status:
    "400": "invalid_request"
    "401": "authentication"
    "403": "permission_denied"
    "404": "not_found"
    "429": "rate_limited"
    "500": "server_error"
    "503": "overloaded"

capabilities:
  required:
    - text
    - streaming
    - tools
  optional:
    - vision
    - audio
    - parallel_tools
    - reasoning
    - structured_output
    - image_generation
    - stt
    - tts
  feature_flags:
    structured_output: true
    parallel_tool_calls: true
    streaming_usage: true
    system_messages: true
    image_generation: true

parameters:
  temperature: { type: float, range: [0.0, 2.0], default: 1.0 }
  max_tokens: { type: integer, min: 1, max: 16384 }
  top_p: { type: float, range: [0.0, 1.0] }
  stream: { type: boolean }

streaming:
  decoder:
    format: "sse"
    strategy: "openai_chat"
    done_signal: "[DONE]"
    prefix: "data: "
  event_map:
    - match: "$.choices[0].delta.content"
      emit: "PartialContentDelta"
      extract:
        content: "$.choices[0].delta.content"
    - match: "$.choices[0].delta.tool_calls"
      emit: "PartialToolCall"
      extract:
        tool_calls: "$.choices[0].delta.tool_calls"
    - match: "$.choices[0].finish_reason"
      emit: "StreamEnd"
      extract:
        finish_reason: "$.choices[0].finish_reason"

multimodal:
  input:
    vision:
      supported: true
      formats: [jpeg, png, gif, webp]
      encoding_methods: [base64_inline, url]
      document_understanding: true
    audio:
      supported: true
      formats: [mp3, wav, flac, m4a, ogg]
      speech_recognition: true
      real_time_streaming: true
    video:
      supported: false
  output:
    text: true
    audio:
      supported: true
      formats: [mp3, wav]
      real_time_tts: true
      natural_voice: true
      voice_selection: true
    image:
      supported: true
      formats: [png, jpeg]
    video:
      supported: false

api_families: ["chat_completions"]
default_api_family: "chat_completions"

endpoints:
  chat:
    path: "/chat/completions"
    method: "POST"
    adapter: "openai"

services:
  list_models:
    path: "/models"
    method: "GET"
    response_binding: "data"

retry_policy:
  strategy: "exponential_backoff"
  max_retries: 3
  min_delay_ms: 1000
  max_delay_ms: 30000
  jitter: "full"
  retry_on_http_status: [429, 500, 502, 503]

termination:
  source_field: "finish_reason"
  mapping:
    stop: "end_turn"
    length: "max_tokens"
    tool_calls: "tool_use"
    content_filter: "refusal"

metadata:
  api_compatibility: openai
  regional:
    primary: china
  sdk:
    python: openai
    typescript: openai
