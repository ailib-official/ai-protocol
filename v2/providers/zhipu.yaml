# Zhipu GLM-5.2 V2 Provider Manifest — SOTA 开源编码 + 视觉 Agent 模型
# AI-Protocol V2 Provider Manifest
# Provider: Zhipu AI (智谱AI) | Models: GLM-5.2 / GLM-5V-Turbo
# Last Updated: 2026-06-26 (updated from GLM-5 → 5.2)
# Source: https://z.ai/blog/glm-5 (2026-02), https://docs.z.ai (2026-06)
$schema: "https://raw.githubusercontent.com/ailib-official/ai-protocol/main/schemas/v2/provider.json"

# === Ring 1: Core Skeleton ===
id: zhipu
aliases:
  - glm
protocol_version: "2.0"
name: "Zhipu AI"
version: "5.2.0"
status: stable
category: ai_provider
official_url: "https://docs.z.ai"
support_contact: "https://z.ai"

endpoint:
  base_url: "https://api.z.ai/api/paas/v4"
  chat: "/chat/completions"
  auth:
    type: "bearer"
    header: "Authorization"
    prefix: "Bearer"
    token_env: "ZHIPU_API_KEY"

error_classification:
  by_http_status:
    "400": "invalid_request"
    "401": "authentication"
    "402": "insufficient_quota"
    "403": "permission_denied"
    "404": "not_found"
    "429": "rate_limited"
    "500": "server_error"
    "503": "overloaded"
  by_error_code:
    "context_length_exceeded": "request_too_large"
    "model_not_found": "not_found"
    "rate_limit_exceeded": "rate_limited"
    "insufficient_quota": "quota_exhausted"

availability:
  required: false
  regions:
    - cn
    - global
  check:
    method: GET
    path: "/models"
    expected_status: [200, 401]
    timeout_ms: 5000

# === Ring 2: Capability Mapping ===
capabilities:
  required:
    - text
    - streaming
    - tools
  optional:
    - vision
    - parallel_tools
    - agentic
    - reasoning
    - structured_output
  feature_flags:
    structured_output: true
    parallel_tool_calls: true
    extended_thinking: true
    streaming_usage: true
    system_messages: true

  tool_calling:
    native:
      supported: true
      reliability: "full"
      parallel: true
      streaming: true
      notes: "Well-evaluated on MCP-Atlas 500-task benchmark; reliable native tool calling"
    text_fallback: null

capability_profile:
  phase: "ios_v1"
  inputs:
    modalities: ["text", "image"]
  outcomes:
    types: ["text_completion", "structured_json", "tool_call_sequence"]
  systems:
    requires: ["mcp"]

parameters:
  temperature: { type: float, range: [0.0, 1.0], default: 0.7 }
  max_tokens: { type: integer, min: 1, max: 128000 }
  top_p: { type: float, range: [0.0, 1.0] }
  stream: { type: boolean }
  reasoning_effort: { type: string, enum: ["high", "max"], default: "max" }

streaming:
  decoder:
    format: "sse"
    strategy: "openai_chat"
    done_signal: "[DONE]"
    prefix: "data: "
  content_path: "$.choices[0].delta.content"
  tool_call_path: "$.choices[0].delta.tool_calls"
  usage_path: "$.usage"
  event_map:
    - match: "exists($.choices[*].delta.content)"
      emit: "PartialContentDelta"
      fields:
        content: "$.choices[*].delta.content"
    - match: "exists($.choices[*].delta.reasoning_content)"
      emit: "ThinkingDelta"
      fields:
        thinking: "$.choices[*].delta.reasoning_content"
    - match: "exists($.choices[*].delta.tool_calls)"
      emit: "PartialToolCall"
      fields:
        tool_calls: "$.choices[*].delta.tool_calls"
    - match: "exists($.usage)"
      emit: "Metadata"
      fields:
        usage: "$.usage"
    - match: "$.choices[*].finish_reason != null"
      emit: "StreamEnd"
      fields:
        finish_reason: "$.choices[*].finish_reason"
  stop_condition: "$.choices[0].finish_reason != null"

multimodal:
  input:
    vision:
      supported: true
      formats: ["jpeg", "png", "webp"]
      encoding_methods: ["base64_inline", "url"]
      document_understanding: true
    audio:
      supported: false
    video:
      supported: true
      formats: ["mp4", "mov", "avi"]
  output:
    text: true
    audio:
      supported: false
    image:
      supported: false

# === Ring 3: Advanced Extensions ===
api_families: ["chat_completions"]
default_api_family: "chat_completions"

endpoints:
  chat:
    path: "/chat/completions"
    method: "POST"
    adapter: "openai"

services:
  list_models:
    path: "/models"
    method: "GET"

retry_policy:
  strategy: "exponential_backoff"
  max_retries: 3
  min_delay_ms: 1000
  max_delay_ms: 30000
  jitter: "full"
  retry_on_http_status: [429, 500, 502, 503]

termination:
  source_field: "finish_reason"
  mapping:
    stop: "end_turn"
    length: "max_tokens"
    tool_calls: "tool_use"

metadata:
  api_compatibility: openai
  open_source:
    license: MIT
    hugging_face: "https://huggingface.co/zai-org/GLM-5.2"
  agentic_engineering:
    supported: true
    capabilities: [long_horizon_planning, multi_step_workflows, autonomous_debugging, computer_use]
  models:
    glm-5.2:
      context_window: 1048576
      max_output_tokens: 128000
      release_date: "2026-05-01"
      architecture: { type: moe, total: "744B", active: "40B" }
      thinking: "dual_mode"
      reasoning_effort: ["high", "max"]
    glm-5v-turbo:
      context_window: 200000
      max_output_tokens: 64000
      release_date: "2026-04-01"
      architecture: { type: moe, total: "744B", active: "40B" }
      vision: true
      computer_use: true
      mcp_support: true
    glm-5.1:
      context_window: 200000
      max_output_tokens: 128000
      release_date: "2026-03-01"
      architecture: { type: moe, total: "744B", active: "40B" }
      status: "deprecated"
    glm-5:
      context_window: 200000
      max_output_tokens: 128000
      release_date: "2026-02-11"
      architecture: { type: moe, total: "744B", active: "40B" }
      pricing: { input_per_1m: 1.00, output_per_1m: 3.20 }
  regional:
    primary: china
    international_base: "https://api.z.ai/api/paas/v4"
    legacy_base: "https://open.bigmodel.cn/api/paas/v4"
    international_partners: [aimlapi, openrouter]
  sdk:
    note: "OpenAI-compatible — use openai SDK with base_url override"
    python: openai
    typescript: openai
