$schema: "https://raw.githubusercontent.com/ailib-official/ai-protocol/main/schemas/v1.json"
protocol_version: "1.5"

# Stability AI Model Instances
# Notes: Stability AI primarily provides generative AI for images, videos, and audio
# Text generation capabilities are limited or model-specific

models:
