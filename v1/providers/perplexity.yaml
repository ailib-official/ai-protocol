# AI-Protocol Provider Manifest for Perplexity
$schema: "../../../schemas/v1.json"
id: perplexity
protocol_version: "1.1"

endpoint:
  base_url: "https://api.perplexity.ai"
  protocol: "https"

availability:
  required: true
  regions: ["global"]
  check:
    method: "GET"
    path: "/models" # Check access
    expected_status: [200]

capabilities:
  streaming: true
  tools: false # Perplexity mostly strictly search/chat
  vision: false 

auth:
  type: "bearer"
  key_env: "PPLX_API_KEY"

parameter_mappings:
  model: model
  messages: messages
  max_tokens: max_tokens
  temperature: temperature
  stream: stream

streaming:
  decoder:
    format: "sse"
  # Standard OpenAI-compatible streaming
  content_path: "$.choices[0].delta.content"
  usage_path: "$.usage"
  stop_condition: "$.choices[0].finish_reason"

retry_policy:
  strategy: "exponential_backoff"
  retry_on_http_status: [429, 500, 503]
