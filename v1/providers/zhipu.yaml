# AI-Protocol Provider Manifest for Zhipu AI (GLM)
$schema: "https://raw.githubusercontent.com/hiddenpath/ai-protocol/main/schemas/v1.json"
id: zhipu
protocol_version: "1.1"

endpoint:
  base_url: "https://open.bigmodel.cn/api/paas/v4"
  protocol: "https"

availability:
  required: true
  regions: ["cn"]
  check:
    method: "GET"
    path: "/tools" # Zhipu doesn't always show models list freely, tooling check might be better or simple retrieval
    expected_status: [200, 401]

capabilities:
  streaming: true
  tools: true
  vision: true
  agentic: true

auth:
  type: "bearer"
  key_env: "ZHIPU_API_KEY"
  # Note: Zhipu sometimes uses JWT, but new V4 API is often standard Bearer or API Key header.
  # V4 SDK uses sync generation of JWT from APK key, but raw API often accepts direct key if specified.
  # Standardizing on Bearer for V4 API compatibility layer.

parameter_mappings:
  model: model
  messages: messages
  max_tokens: max_tokens
  temperature: temperature
  stream: stream
  tools: tools
  tool_choice: tool_choice

streaming:
  decoder:
    format: "sse"
  # OpenAI Compatible
  content_path: "$.choices[0].delta.content"
  tool_call_path: "$.choices[0].delta.tool_calls"
  usage_path: "$.usage"
  stop_condition: "$.choices[0].finish_reason"

retry_policy:
  strategy: "exponential_backoff"
  retry_on_http_status: [429, 500, 502, 503]
