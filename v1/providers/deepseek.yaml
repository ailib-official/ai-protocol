$schema: "https://spec.ai-protocol.org/schemas/v1.json"

id: deepseek
protocol_version: "1.1"

version: "v1"
base_url: "https://api.deepseek.com/v1"
auth:
  type: bearer
  token_env: "DEEPSEEK_API_KEY"
payload_format: "openai_style"

# OpenAI-compatible API families
api_families: ["chat_completions", "completions"]
default_api_family: "chat_completions"
endpoints:
  chat_completions_create: "/chat/completions"
  completions_create: "/completions"

# Termination reason normalization (see v1/spec.yaml: standard_schema.streaming_events.termination_reasons)
termination:
  source_field: "finish_reason"
  mapping:
    stop: "end_turn"
    length: "max_tokens"
    tool_calls: "tool_use"
    content_filter: "refusal"
  notes:
    - "OpenAI-compatible: finish_reason is reported per candidate."

# Tool invocation normalization (see v1/spec.yaml: standard_schema.content_blocks)
tooling:
  source_model: "openai_tool_calls"
  tool_use:
    id_path: "id"
    name_path: "function.name"
    input_path: "function.arguments"
    input_format: "json_string"
  notes:
    - "OpenAI-compatible tool_calls.function.arguments is typically a JSON string; runtimes SHOULD parse it into an object when normalizing."

# Rate limits (VERIFIED: DeepSeek rate limits are dynamically adjusted per account; headers not specified in docs)
# Source: https://api-docs.deepseek.com/faq
# NOTE: `rate_limit_headers` omitted until DeepSeek documents specific header names.

# Retry policy (VERIFIED from DeepSeek error codes doc: 429 pace requests; 500/503 retry after brief wait)
# Source: https://api-docs.deepseek.com/quick_start/error_codes
retry_policy:
  strategy: "exponential_backoff"
  max_retries: 2
  min_delay_ms: 1000
  max_delay_ms: 8000
  jitter: "full"
  retry_on_http_status: [429, 500, 503]
  notes:
    - "429 Rate Limit Reached: pace requests reasonably; apply backoff then retry."
    - "500 Server Error: retry after a brief wait."
    - "503 Server Overloaded: retry after a brief wait."
    - "400/401/402/422 are non-retryable client/account errors."

# Error classification hints (see v1/spec.yaml: standard_schema.error_handling.error_classes)
error_classification:
  by_http_status:
    "400": "invalid_request"
    "401": "authentication"
    "402": "quota_exhausted"
    "422": "invalid_request"
    "429": "rate_limited"
    "500": "server_error"
    "503": "overloaded"
  notes:
    - "DeepSeek error codes doc uses HTTP status codes with descriptions; treat 402 as insufficient balance (quota_exhausted)."
parameter_mappings:
  temperature: "temperature"
  max_tokens: "max_tokens"
  stream: "stream"
  top_p: "top_p"
  stop_sequences: "stop"
  tools: "tools"
  tool_choice: "tool_choice"
response_format: "openai_style"
response_paths:
  content: "choices[0].message.content"
  tool_calls: "choices[0].message.tool_calls"
  usage: "usage"
  finish_reason: "choices[0].finish_reason"
streaming:
  event_format: "data_lines"
  decoder:
    format: "sse"
    delimiter: "\n\n"
    prefix: "data: "
    # DeepSeek may emit `: keep-alive` SSE comment lines while waiting to be scheduled.
    strategy: "sse_ignore_comments"
  content_path: "choices[0].delta.content"
  tool_call_path: "choices[0].delta.tool_calls"
features:
  multi_candidate:
    support_type: "native"
    param_name: "n"
  response_mapping:
    tool_calls:
      path: "choices[0].message.tool_calls"
      fields:
        id: "id"
        name: "function.name"
        args: "function.arguments"
    error:
      message_path: "error.message"
      code_path: "error.code"
      type_path: "error.type"
      param_path: "error.param"
capabilities: [chat, tools, streaming, agentic, reasoning]
experimental_features:
  - "deep_thinking"
