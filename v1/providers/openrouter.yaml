# AI-Protocol Provider Manifest for OpenRouter
$schema: "https://raw.githubusercontent.com/hiddenpath/ai-protocol/main/schemas/v1.json"
id: openrouter
protocol_version: "1.1"

endpoint:
  base_url: "https://openrouter.ai/api/v1"
  protocol: "https"

availability:
  required: true
  regions: ["global"]
  check:
    method: "GET"
    path: "/models"
    expected_status: [200]

capabilities:
  streaming: true
  tools: true
  vision: true
  reasoning: true # Supports o1, r1 etc via routing

auth:
  type: "bearer"
  key_env: "OPENROUTER_API_KEY"

parameter_mappings:
  model: model
  messages: messages
  max_tokens: max_tokens
  temperature: temperature
  stream: stream
  tools: tools
  tool_choice: tool_choice

streaming:
  decoder:
    format: "sse"
  # OpenRouter normalizes to OpenAI format
  content_path: "$.choices[0].delta.content"
  tool_call_path: "$.choices[0].delta.tool_calls"
  usage_path: "$.usage" # OpenRouter often sends usage in final chunk
  stop_condition: "$.choices[0].finish_reason"

retry_policy:
  strategy: "exponential_backoff"
  retry_on_http_status: [429, 500, 502, 503]
