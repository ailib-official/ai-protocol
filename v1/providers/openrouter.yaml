$schema: "https://raw.githubusercontent.com/hiddenpath/ai-protocol/main/schemas/v1.json"

id: openrouter
protocol_version: "1.5"

name: OpenRouter
version: "v1"
status: stable
category: third_party_aggregator
official_url: "https://openrouter.ai/docs"
support_contact: "https://openrouter.ai/contact"

endpoint:
  base_url: "https://openrouter.ai/api/v1"
  protocol: https
  timeout_ms: 120000

auth:
  type: bearer
  token_env: "OPENROUTER_API_KEY"

payload_format: "openai_style"

# OpenAI-compatible API (aggregates multiple providers)
api_families: ["chat_completions"]
default_api_family: "chat_completions"

endpoints:
  chat:
    path: "/chat/completions"
    method: "POST"
    adapter: "openai"

services:
  list_models:
    path: "/models"
    method: "GET"
    response_binding: "data"
  get_generation:
    path: "/generation"
    method: "GET"

termination:
  source_field: "finish_reason"
  mapping:
    stop: "end_turn"
    length: "max_tokens"
    tool_calls: "tool_use"
    content_filter: "refusal"
  notes:
    - "OpenRouter normalizes responses to OpenAI format."
    - "Aggregates 100+ models from various providers."

tooling:
  source_model: "openai_tool_calls"
  tool_use:
    id_path: "id"
    name_path: "function.name"
    input_path: "function.arguments"
    input_format: "json_string"
  notes:
    - "Tool support depends on underlying model."

retry_policy:
  strategy: "exponential_backoff"
  max_retries: 3
  min_delay_ms: 1000
  max_delay_ms: 60000
  jitter: "full"
  retry_on_http_status: [429, 500, 502, 503]
  notes:
    - "OpenRouter may have longer latencies due to routing."

error_classification:
  by_http_status:
    "400": "invalid_request"
    "401": "authentication"
    "402": "quota_exhausted"
    "403": "permission_denied"
    "404": "not_found"
    "429": "rate_limited"
    "500": "server_error"
    "502": "server_error"
    "503": "overloaded"

parameter_mappings:
  temperature: "temperature"
  max_tokens: "max_tokens"
  stream: "stream"
  top_p: "top_p"
  frequency_penalty: "frequency_penalty"
  presence_penalty: "presence_penalty"
  stop_sequences: "stop"
  tools: "tools"
  tool_choice: "tool_choice"
  seed: "seed"
  top_k: "top_k"

response_format: "openai_style"

response_paths:
  content: "choices[0].message.content"
  tool_calls: "choices[0].message.tool_calls"
  usage: "usage"
  finish_reason: "choices[0].finish_reason"

streaming:
  event_format: "data_lines"
  decoder:
    format: "sse"
    delimiter: "\n\n"
    prefix: "data: "
    done_signal: "[DONE]"
  content_path: "choices[0].delta.content"
  tool_call_path: "choices[0].delta.tool_calls"
  usage_path: "usage"
  frame_selector: "exists($.choices) || exists($.error)"
  event_map:
    - match: "exists($.choices[*].delta.content)"
      emit: "PartialContentDelta"
      fields:
        content: "$.choices[*].delta.content"
    - match: "exists($.choices[*].delta.tool_calls[*].function.name)"
      emit: "ToolCallStarted"
      fields:
        tool_call_id: "$.choices[*].delta.tool_calls[*].id"
        tool_name: "$.choices[*].delta.tool_calls[*].function.name"
        index: "$.choices[*].delta.tool_calls[*].index"
    - match: "exists($.choices[*].delta.tool_calls[*].function.arguments)"
      emit: "PartialToolCall"
      fields:
        arguments: "$.choices[*].delta.tool_calls[*].function.arguments"
        index: "$.choices[*].delta.tool_calls[*].index"
    - match: "exists($.usage)"
      emit: "Metadata"
      fields:
        usage: "$.usage"
    - match: "exists($.choices[*].finish_reason)"
      emit: "FinalCandidate"
      fields:
        finish_reason: "$.choices[*].finish_reason"
  stop_condition: "$.choices[0].finish_reason != null"

features:
  multi_candidate:
    support_type: "native"
    param_name: "n"
  response_mapping:
    tool_calls:
      path: "choices[0].message.tool_calls"
      fields:
        id: "id"
        name: "function.name"
        args: "function.arguments"
    error:
      message_path: "error.message"
      code_path: "error.code"
      type_path: "error.type"

capabilities:
  streaming: true
  tools: true
  vision: true
  agentic: true
  parallel_tools: true
  reasoning: true

availability:
  required: false
  regions:
    - global
  check:
    method: GET
    path: "/models"
    expected_status: [200, 401]
    timeout_ms: 5000

experimental_features:
  - "model_routing"
  - "fallback_models"
  - "cost_tracking"
