name: Validate Configurations

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'v1/**'
      - 'v2-alpha/**'
      - 'examples/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/validate.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'v1/**'
      - 'v2-alpha/**'
      - 'examples/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/validate.yml'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies and run canonical validator
      run: |
        npm install
        npm run validate

    - name: Setup Python and yamllint
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install yamllint
      run: pip install yamllint

    - name: Lint YAML syntax (yamllint)
      run: |
        for d in v1/providers v1/models examples; do
          if [ -d "$d" ]; then
            for f in "$d"/*.yaml "$d"/*.yml; do
              [ -f "$f" ] && yamllint "$f" || true
            done
          fi
        done
      continue-on-error: true

    - name: Validate JSON schemas syntax
      run: |
        set -e
        echo "Validating JSON schemas syntax..."
        for schema in schemas/*.json schemas/v2/*.json; do
          [ -f "$schema" ] && python -c "import json; json.load(open('$schema'))" && echo "✅ $schema is valid JSON"
        done
