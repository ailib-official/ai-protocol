name: Fact Check Models (Online)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # weekly Monday 03:00 UTC

jobs:
  fact_check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install

      # Best-effort baseline (no secrets required): should always pass, but prints a summary.
      - name: Fact check (best-effort)
        run: npm run fact-check:models

      # Strict checks are run per-provider only when that provider's secret exists.
      - name: Fact check (strict - OpenAI)
        if: ${{ secrets.OPENAI_API_KEY != '' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/fact-check-models.js --providers openai --strict --require-keys

      - name: Fact check (strict - Gemini)
        if: ${{ secrets.GEMINI_API_KEY != '' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/fact-check-models.js --providers gemini --strict --require-keys

      - name: Fact check (strict - Mistral)
        if: ${{ secrets.MISTRAL_API_KEY != '' }}
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: node scripts/fact-check-models.js --providers mistral --strict --require-keys

      - name: Fact check (strict - DeepSeek)
        if: ${{ secrets.DEEPSEEK_API_KEY != '' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/fact-check-models.js --providers deepseek --strict --require-keys

      - name: Fact check (strict - Groq)
        if: ${{ secrets.GROQ_API_KEY != '' }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/fact-check-models.js --providers groq --strict --require-keys

